spring:
    datasource:
        url: jdbc:h2:tcp://localhost/~/jpashop  # 기존 파일 DB 그대로
        username: sa
        password:
        driver-class-name: org.h2.Driver

    jpa:
        hibernate:
            ddl-auto: create  # 혹은 update (테이블 날리기 싫으면)
        properties:
            hibernate:
                format_sql: true
                highlight_sql: true

logging.level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
#  org.hibernate.type: trace #스프링 부트 2.x, hibernate5
#  org.hibernate.orm.jdbc.bind: trace #스프링 부트 3.x, hibernate6